<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Closet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Closet">
<meta name="theme-color" content="#F5F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131118" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed tab bar, bottom sheets for editing. Hang-tag price labels as the signature detail. */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --ink:#1E1A2C; --muted:#6C667F; --line:#E2DFE9;
  --accent:#7B2D5E; --accent-ink:#FFFFFF; --accent-soft:#F3E6EE;
  --tag:#EADFCB; --tag-ink:#4A3D27; --ok:#2F7A4F; --danger:#B3261E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", -apple-system, system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131118; --surface:#1D1A25; --ink:#EEEAF6; --muted:#A39EB4; --line:#2F2A3B;
  --accent:#E58BBE; --accent-ink:#22101B; --accent-soft:#3A2232;
  --tag:#3D3426; --tag-ink:#EBDDC2; --ok:#6CC892; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131118; --surface:#1D1A25; --ink:#EEEAF6; --muted:#A39EB4; --line:#2F2A3B;
  --accent:#E58BBE; --accent-ink:#22101B; --accent-soft:#3A2232;
  --tag:#3D3426; --tag-ink:#EBDDC2; --ok:#6CC892; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{background:var(--bg);margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,select,textarea{font-size:16px!important}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 12px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
main .wrap{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
/* filters */
.search{width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>select{flex:1 1 120px;min-width:0}
select,.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r)}
.ph{aspect-ratio:3/4;max-width:100%;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;box-sizing:border-box}
.ph .ini{font-family:var(--display);font-size:34px;color:var(--muted)}
.card .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.card .meta span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{flex:none;width:11px;height:11px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);display:inline-block}
/* hang tag */
.tag{position:absolute;top:8px;right:-3px;background:var(--tag);color:var(--tag-ink);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px 2px 13px;border-radius:3px 6px 6px 3px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);transform:rotate(4deg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--bg)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-family:var(--display);color:var(--ink);font-size:22px;margin:0;text-wrap:balance}
/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.collage{aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line);border:1px solid var(--line)}
.collage>*{background:var(--surface);overflow:hidden;display:grid;place-items:center;min-height:0}
.collage img{width:100%;height:100%;object-fit:cover}
.collage.n1>*{grid-column:1/-1;grid-row:1/-1}
.collage.n2>*{grid-row:1/-1}
.collage.n3>:first-child{grid-row:1/-1}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.stale{background:var(--tag);color:var(--tag-ink)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead h2{font-family:var(--display);font-size:22px;margin:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:2px}
.day{all:unset;cursor:pointer;aspect-ratio:3/4;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;display:block}
.day:focus-visible{outline:2px solid var(--accent)}
.day.out{opacity:.35}
.day .n{position:absolute;top:3px;left:5px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;z-index:1;text-shadow:0 0 3px var(--surface)}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;box-sizing:border-box}
.day.has:not(.img){background:var(--accent-soft)}
.day.future.has{border-style:dashed;border-color:var(--accent)}
.day.future.has img{opacity:.8}
.day.today{border:2px solid var(--ink)}
.day .wt{position:absolute;top:3px;right:4px;font-size:10px;font-weight:600;color:var(--muted);z-index:1;font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--surface)}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.wxhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.wxhead b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wxd{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;min-width:0}
.wxd.today{background:var(--accent-soft)}.wxd:focus-visible{outline:2px solid var(--accent)}
.wxd small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.wxd b{font-size:14px;font-variant-numeric:tabular-nums}.wxd .pop{color:var(--accent);font-size:10px}
.wxi{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wxi.sun{stroke:#d08a12}.wxi.rain,.wxi.storm{stroke:#3b74c4}
.wxset{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.wxcity{display:flex;gap:6px;flex:1;min-width:180px}
.wxcity input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.wxline{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.day .dot{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.legend{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.li .mini{width:44px;height:58px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center}
.li .mini img{width:100%;height:100%;object-fit:cover}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--muted)}
h3{font-family:var(--display);font-size:17px;margin:8px 0 0}
/* nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{all:unset;cursor:pointer;text-align:center;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 20px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0/.22)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(10 8 16/.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet>*{flex-shrink:0}
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance;min-width:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{display:block;cursor:pointer;width:min(220px,60%);margin:0 auto}
.photo .ph{border-style:dashed}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo .hint{font-size:13px;color:var(--muted);text-align:center;padding:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;flex:1 1 auto}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.picker{flex:none;min-height:150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.pk{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.pk .ph{border-radius:10px}
.pk small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pk[aria-pressed="true"] .ph{outline:3px solid var(--accent);outline-offset:-1px}
.pk[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;font-weight:700}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px;scrollbar-width:none}
.oc{all:unset;cursor:pointer;flex:none;width:96px;display:flex;flex-direction:column;gap:4px}
.oc small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc[aria-pressed="true"] .collage{outline:3px solid var(--accent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.hright{display:flex;align-items:center;gap:10px;min-width:0}
/* closets + type sections */
.switch{display:flex;gap:8px;align-items:center;min-width:0}
.switch .chips{flex:1;min-width:0}
.chip small{opacity:.6;font-size:12px;margin-left:2px;font-variant-numeric:tabular-nums}
.chip.ghost{flex:none;background:transparent;border-style:dashed;color:var(--muted)}
.closets .chip{font-weight:600}
.tsec{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.thead h3{margin:0}
/* cut-out photos sit on a soft ground and are never cropped */
.ph.cut{background:radial-gradient(circle at 50% 40%,var(--surface),color-mix(in srgb,var(--line) 55%,var(--surface)))}
.ph.cut img{object-fit:contain;padding:8%}
.mini.cut img,.day.cut img{object-fit:contain;padding:6%}
/* outfit board */
.board{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.board.big{width:min(100%,420px);margin:0 auto}
.board.edit{touch-action:none}
.pc{position:absolute;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pc img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.pc.cut img{filter:drop-shadow(0 3px 6px rgb(0 0 0/.18))}
.pc.noimg{background:var(--accent-soft);border-radius:8px;display:grid;place-items:center;padding:4px;text-align:center;font-size:11px;font-weight:600;overflow:hidden}
.board.edit .pc{cursor:grab}
.pc.sel{outline:2px dashed var(--accent);outline-offset:3px}
.boardwrap{display:flex;flex-direction:column;gap:8px}
.btools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;min-width:44px}
.bhint{margin:0;font-size:13px;text-align:center}
/* shuffle */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.slot .mini,.li .mini{width:44px;height:58px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center}
.slot .mini img{width:100%;height:100%;object-fit:cover}
.slot .tx{flex:1;min-width:0}.slot .tx small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.slot .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.lock[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* stats */
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bl{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bt{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bt span{display:block;height:100%;background:var(--accent);border-radius:5px}
.bv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
/* closets sheet + photo slots */
.crow{display:flex;gap:8px;align-items:center}
.crow input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.btn.sm{flex:none;padding:8px 12px;font-size:14px}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:13px;text-decoration:underline;text-align:center}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.pslot .photo{width:100%}
.bulkbtn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);border-radius:var(--r);padding:11px;font-weight:600;color:var(--accent);background:var(--surface)}
.bulkbtn:focus-visible{outline:2px solid var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;text-align:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.brow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.brow .mini{width:48px;height:62px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center}
.brow .mini img{width:100%;height:100%;object-fit:cover}
.brow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.brow .tx small{color:var(--muted)}
.brow input,.brow select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.brow .bprice{width:68px;flex:none;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.colrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
